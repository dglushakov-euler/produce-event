name: Build and Publish

# The VPS cannot reliably accept inbound SSH (provider-side filtering),
# so deploys are pull-based: Actions builds and pushes the image to ghcr.io,
# and Watchtower on the server picks it up within ~2 minutes.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dglushakov-euler/produce-event:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
